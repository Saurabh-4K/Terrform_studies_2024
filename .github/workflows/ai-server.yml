name: App server (deploy)

# Run by hand from the Actions tab. Deploys salary-runway-app/server to
# Cloudflare Workers (free plan): crash reports, and the AI weekly plan once
# it has a key. Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permission (needed)
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID (needed)
#   CRASH_READ_KEY         a long random password; with it you can read crash
#                          reports at <server>/crashes. Without it nobody can read them.
#   ANTHROPIC_API_KEY      (later, for the AI plan) key from the Claude Console
#   INVITE_CODES           (later, for the AI plan) comma-separated tester codes
# Without the last two the server runs crash reports only: the AI plan answers
# "invite" to everyone and never reaches Anthropic, so nothing is spent.
# Crash reports are kept in a Workers KV store this workflow makes the first time.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salary-runway-app/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Where crash reports are kept (90 days each). Made once; later runs find it by its name.
      - name: Crash reports storage
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces"
          find() { curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api?per_page=100" | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));const n=(r.result||[]).find((x)=>x.title==='salary-runway-crashes');process.stdout.write(n?n.id:'')"; }
          id=$(find)
          if [ -z "$id" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"title":"salary-runway-crashes"}' "$api" > /dev/null
            id=$(find)
          fi
          if [ -n "$id" ]; then printf '\n[[kv_namespaces]]\nbinding = "CRASHES"\nid = "%s"\n' "$id" >> wrangler.toml; echo "Crash reports storage ready."; else echo "::warning::Couldn't make the crash reports storage; the token may need Workers KV Storage: Edit."; fi
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: salary-runway-app/server
          wranglerVersion: "4.152.0"
      # Each secret only when it's set: with no Anthropic key the server runs crash reports only.
      - name: Server secrets
        env:
          CRASH_READ_KEY: ${{ secrets.CRASH_READ_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INVITE_CODES: ${{ secrets.INVITE_CODES }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CRASH_READ_KEY ANTHROPIC_API_KEY INVITE_CODES; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx wrangler secret put "$name"; else echo "No $name secret: skipped."; fi
          done
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::notice::Crash reports only: the AI weekly plan is off until ANTHROPIC_API_KEY and INVITE_CODES are added."; fi
