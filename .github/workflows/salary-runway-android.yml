name: Salary Runway Android APK

# One release a week: Sunday 03:21 UTC (about 8:51 AM in India).
# Pushes don't build. Use "Run workflow" on the Actions tab for an urgent build,
# or untick "release" to only check that the app compiles.
on:
  schedule:
    - cron: '21 3 * * 0'
  workflow_dispatch:
    inputs:
      release:
        description: Publish the APK to the download link
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: salary-runway-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salary-runway-app
    steps:
      - uses: actions/checkout@v4

      # Skip the week when nothing changed since the last release.
      - name: Check for changes since the last release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view salary-runway-latest --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "No changes since the last release ($last). Skipping this week."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: salary-runway-app/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        if: steps.changes.outputs.build == 'true'
        run: npm ci

      - name: Test
        if: steps.changes.outputs.build == 'true'
        run: npm test

      # The on-phone AI downloads its model from Hugging Face (LocalAiPlugin.java).
      # Warn if a model file has been renamed or removed.
      - name: Check the AI model downloads
        if: steps.changes.outputs.build == 'true'
        run: |
          for path in $(grep -oE 'litert-community/[^"]+\.task' android/app/src/main/java/com/salaryrunway/app/LocalAiPlugin.java); do
            if curl -sfIL -o /dev/null "https://huggingface.co/$path"; then echo "ok: $path"; else echo "::warning::AI model missing: $path"; fi
          done

      - name: Copy the web app into the Android project
        if: steps.changes.outputs.build == 'true'
        run: npm run android:sync

      - name: Build APK
        if: steps.changes.outputs.build == 'true'
        working-directory: salary-runway-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        if: steps.changes.outputs.build == 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SalaryRunway.apk

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build == 'true'
        with:
          name: SalaryRunway-apk
          path: salary-runway-app/SalaryRunway.apk

      # A fixed release tag gives the phone one link that always has the newest APK.
      - name: Publish the download
        if: steps.changes.outputs.build == 'true' && (github.event_name == 'schedule' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=salary-runway-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SalaryRunway.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Salary Runway Android (build $GITHUB_RUN_NUMBER)" \
            --notes "Open this page on your Android phone and tap SalaryRunway.apk to download. Allow installs from your browser when Android asks. New builds install over the old one and keep your data."
