name: Hisab Se Android APK

# One release a week: Sunday 10:21 UTC (about 3:51 PM in India).
# Pushes don't build. Use "Run workflow" on the Actions tab for an urgent build,
# or untick "release" to only check that the app compiles.
on:
  schedule:
    - cron: '21 10 * * 0'
  workflow_dispatch:
    inputs:
      release:
        description: Publish the APK to the download link
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: salary-runway-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    defaults:
      run:
        working-directory: salary-runway-app
    steps:
      - uses: actions/checkout@v4

      # Skip the week when nothing changed since the last release.
      - name: Check for changes since the last release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view salary-runway-latest --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "No changes since the last release ($last). Skipping this week."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: salary-runway-app/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        if: steps.changes.outputs.build == 'true'
        run: npm ci

      - name: Test
        if: steps.changes.outputs.build == 'true'
        run: npm test

      - name: Test the weekly plan server
        if: steps.changes.outputs.build == 'true'
        working-directory: salary-runway-app/server
        run: npm ci && npm test

      - name: Copy the web app into the Android project
        if: steps.changes.outputs.build == 'true'
        run: npm run android:sync

      - name: Build APK
        if: steps.changes.outputs.build == 'true'
        working-directory: salary-runway-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        if: steps.changes.outputs.build == 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SalaryRunway.apk

      # A phone refuses an APK whose signature or alignment is off: check both.
      - name: Verify the APK
        if: steps.changes.outputs.build == 'true'
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs SalaryRunway.apk
          "$tools/zipalign" -c -P 16 4 SalaryRunway.apk && echo "aligned"

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build == 'true'
        with:
          name: SalaryRunway-apk
          path: salary-runway-app/SalaryRunway.apk

  # The APK on an emulator with no network: it must open, and must not have the internet permission.
  device-check:
    needs: apk
    if: needs.apk.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SalaryRunway-apk
          path: salary-runway-app
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: salary-runway-app
          script: bash scripts/device-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-check
          path: |
            salary-runway-app/device-screen.png
            salary-runway-app/ui.xml
          if-no-files-found: ignore

  # A fixed release tag gives the phone one link that always has the newest APK.
  publish:
    needs: [apk, device-check]
    if: needs.apk.outputs.build == 'true' && (github.event_name == 'schedule' || inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SalaryRunway-apk
      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=salary-runway-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SalaryRunway.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Hisab Se Android (build $GITHUB_RUN_NUMBER)" \
            --notes "Open this page on your Android phone and tap SalaryRunway.apk to download. Allow installs from your browser when Android asks. New builds install over the old one and keep your data."
